{% extends "layout.html" %}

{% block main %}
<div class="form-box">
    <h1>Edit Task ✏️</h1>

    <form method="POST">

        <label class="form-label">Task title</label>
        <input
            type="text"
            name="title"
            class="form-control mb-3"
            value="{{ task.title }}"
            required
        >

        <label class="form-label">Description</label>
        <textarea
            name="description"
            class="form-control mb-3"
            rows="4"
            placeholder="What do you need to do?"
        >{{ task.description or "" }}</textarea>

        <label class="form-label">Subject</label>
        <select name="subject_id" class="form-select mb-3">
            <option value="">No subject</option>

            {% for subject in subjects %}
                <option
                    value="{{ subject.id }}"
                    {% if task.subject_id == subject.id %}selected{% endif %}
                >
                    {{ subject.name }}
                </option>
            {% endfor %}
        </select>

        <label class="form-label">Due date</label>
        <input
            type="datetime-local"
            name="due_date"
            class="form-control mb-3"
            value="{{ task.due_date or '' }}"
        >

        <label class="form-label">Priority</label>
        <select name="priority" class="form-select mb-4">
            <option value="High" {% if task.priority == "High" %}selected{% endif %}>
                🔴 High
            </option>

            <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>
                🟡 Medium
            </option>

            <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>
                🟢 Low
            </option>
        </select>

        <button type="submit" class="btn btn-primary w-100">
            Save Changes
        </button>

    </form>
</div>
{% endblock %}
